server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve _next assets from root when requested directly
  location /_next/ {
    try_files $uri $uri/ =404;
  }

  # Some exported pages reference assets with a page prefix, e.g. /home/_next/...
  # Rewrite those to the actual /_next/ path on disk so JS/CSS load correctly.
  location ~* ^/(?:.+)/_next/(.*)$ {
    try_files /_next/$1 =404;
  }

  # Fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
