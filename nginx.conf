server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # Hashed Next.js chunks: filenames change on every build, so they are
  # safe to cache for a year. This is the PageSpeed "efficient cache lifetimes" fix.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /_next/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Some exported pages reference assets with a page prefix, e.g. /home/_next/...
  # Rewrite those to the actual /_next/ path on disk so JS/CSS load correctly.
  location ~* ^/(?:.+)/_next/(.*)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files /_next/$1 =404;
  }

  location ~* \.(?:js|css|woff2?|ttf|otf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|avif)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Main routing for all other requests.
  #
  # Next.js static export produces:
  #   /some-slug.html   <- the actual HTML page file on disk
  #   /some-slug/       <- a directory with internal Next.js metadata files
  #                        (no index.html inside it)
  #
  # Without the rewrite below, a request for /ac-repair-in-gachibowli/ hits
  # the physical directory at /usr/share/nginx/html/ac-repair-in-gachibowli/
  # which has no index.html, so Nginx returns 403 Forbidden.
  #
  # Fix: internally rewrite /slug/ -> /slug so that try_files can resolve
  # the .html file as $uri.html = /slug.html.  The rewrite is internal (no
  # HTTP redirect) so the browser URL stays unchanged.
  location / {
    # Strip a trailing slash from paths that are NOT the root.
    # e.g. /ac-repair-in-gachibowli/ → /ac-repair-in-gachibowli
    #      /locations/hyderabad/begumpet/cctv-installation-in-hyderabad/ →
    #        /locations/hyderabad/begumpet/cctv-installation-in-hyderabad
    # The root "/" itself is excluded by the (.+) capture group so index.html
    # is still served for the homepage.
    rewrite ^/(.+)/$ /$1 last;

    # HTML must stay short-lived so a new deploy is visible immediately.
    add_header Cache-Control "public, max-age=0, must-revalidate";

    # 1. Exact file on disk  (robots.txt, sitemap.xml, logo.webp, etc.)
    # 2. Slug + .html        (/ac-repair-in-gachibowli → ac-repair-in-gachibowli.html)
    # 3. SPA fallback        (should be rare; catches any unknown path)
    try_files $uri $uri.html /index.html;
  }
}
